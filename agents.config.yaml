# St. John the Beloved Plenix test site (STJ2): the role registry (plan §5.1). Generated by dispatch kit 3.4.1 (Project Plan 3.4.1).
# Do not edit. The intake is the source: change it with `dispatch.py set`, rebuild, and commit this file by a PR that links a
# recorded decision. CI fails if this file differs from what the intake generates (plan §9.2 check 11).

project: stj
name: 'St. John the Beloved Plenix test site'
repo: LighthouseCollection/STJ1
default_branch: main
teams: [core]             # the first is the lead team; every member has the same access and permissions
merge_rights: pr-only
merge_roles: []
release_roles: []   # metadata: who opens the release PR (CI does the release)

settings:
  slots: 4                  # agents running at once per team, PM excluded
  reserved_gate_slots: 2    # usable only by PR review gates (G5a-G5e)
  idle_exit_min: 5            # an idle agent is nudged, then closed after the same time again
  ready_min: 3                # Ready items per active lane (advisory: the PM keeps it)
  memory_gb: 4             # per agent session
  pm_memory_gb: 3
  priority: [release, integrate, verify, build, design, spec, evergreen]   # advisory: the PM's order when slots are scarce

runtimes:                          # plan §5.11: the agent tool plus its models per tier
  claude-code: { tool: 'Claude Code', tiers: { small: 'haiku', standard: 'sonnet', capable: 'opus' }, remote_access: true, hooks: true, instructions: CLAUDE.md }

roles:
  - id: pm
    title: 'PM'
    kind: coordinator
    runtime: claude-code
    tier: capable            # opus
    label: "agent:stj-pm"
    definition: .agents/pm.md
    source: plan
    memory_limit: 3G
    lane: spec
    gate: G1
    merge: false
  - id: engineer
    title: 'Engineer'
    kind: lane
    runtime: claude-code
    tier: standard            # sonnet
    label: "agent:stj-engineer"
    definition: .agents/engineer.md
    source: plan
    memory_limit: 4G
    lane: build
    merge: false
  - id: qa
    title: 'QA Engineer'
    kind: task
    runtime: claude-code
    tier: standard            # sonnet
    label: "agent:stj-qa"
    definition: .agents/qa.md
    source: plan
    memory_limit: 4G
    gate: G5d
    applies: always        # metadata for the PM: always | ui | text | sensitive | api
    merge: false
  - id: code-reviewer
    title: 'Code Reviewer'
    kind: task
    runtime: claude-code
    tier: standard            # sonnet
    label: "agent:stj-code-reviewer"
    definition: .agents/code-reviewer.md
    source: plan
    memory_limit: 4G
    gate: G5a
    applies: always        # metadata for the PM: always | ui | text | sensitive | api
    merge: false
