<!doctype html>
<html lang="en" data-plx-mode="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>St. John the Beloved Coptic Orthodox Church</title>
<!-- St. John the Beloved Coptic Orthodox Church: the Plenix test site, a church database and membership app. Every person
     in it is made up. It loads Plenix like any outside app: the four files of one release from the CDN ({{PLENIX}},
     Plenix {{VERSION}}); the server fills in the address (PLENIX_BASE). build.js fills in the site's own scripts under
     their hashed names (app.<hash>.js, the icons), which browsers keep for a year. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script src="{{PLENIX}}theme-boot.js"></script>
<link rel="stylesheet" href="{{PLENIX}}fonts.css">
<link rel="stylesheet" href="{{PLENIX}}plenix.css">
<script src="{{PLENIX}}vendor/react.production.min.js"></script>
<script src="{{PLENIX}}vendor/react-dom.production.min.js"></script>
<script src="{{PLENIX}}plenix.js"></script>
<!-- the site's icons, registered so each draws from its own module (Plenix #557). Written by Plenix's
     tools/icons/site-icons.js from site/; it does nothing on a Plenix without registerIcons (0.73.0) -->
<script src="{{ICONS}}"></script>
{{ENGINES}}
</head>
<body>
<div id="root"></div>
<script src="{{APP}}"></script>
</body>
</html>
